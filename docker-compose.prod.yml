# Production stack — single frontend + backend (adjust secrets via .env)
services:
  easyrental-web:
    build:
      context: .
      dockerfile: apps/easy-rental-web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://easyrental-api:8081
    depends_on:
      easyrental-api:
        condition: service_started

  easyrental-api:
    image: easyrental-api:prod
    build:
      context: ../easy-rental-backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      KERNEL_CLIENT_ID: ${KERNEL_CLIENT_ID}
      KERNEL_API_KEY: ${KERNEL_API_KEY}
      KERNEL_TENANT_ID: ${KERNEL_TENANT_ID}
      KERNEL_BASE_URL: ${KERNEL_BASE_URL:-https://kernel-core.yowyob.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: easyrental
      POSTGRES_USER: easyrental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easyrental}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyrental"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
